[build-system]
requires = [
    "hatchling",
]
build-backend = "hatchling.build"

[project]
name = "muvid"
version = "0.0.53"
description = "Tools to make music videos"
readme = "README.md"
requires-python = ">=3.10"
keywords = []
authors = [
    { name = "Thor Whalen" },
]
# Core: the CLI (cw), the ffmpeg-based visualizer (mixing), and numpy for the
# beat-flash onset envelope (muvid.visualize.reactive). numpy arrives with
# `mixing` too, but muvid imports it directly so it is declared directly. The AI
# narrative pipeline's heavy dependencies are the optional `ai` extra, so
# `muvid.visualize` (and downstreams like `yb`) stay lightweight.
dependencies = [
    "cw>=0.1.1,<0.2",
    # 0.0.46 is where `align_clips_to_reference` puts each clip's analysis WINDOWS to a
    # vote instead of taking one argmax over the whole clip, and reports how much of the
    # clip agreed as `ClipAlignment.support` (muvid#59, thorwhalen/mixing#30). Below it
    # there is no support to read, so muvid's trust verdict falls back to the confidence
    # coefficient — which on the shoot behind muvid#59 refuses two of the three wrong
    # offsets and passes the third, 83 s out.
    #
    # Two earlier floors are subsumed and kept only as history: 0.0.34 is where the
    # confidence scored on the onset ENVELOPE rather than the raw waveform (below it
    # every clip of a real multi-device shoot fell under the gate — muvid#15), and
    # 0.0.44 is where support first appeared but was located on the waveform, so
    # `feature='envelope'` and `feature='waveform'` returned byte-identical offsets and
    # a unanimous `support=1.00` could sit on an offset 15 s wrong. 0.0.46 is the first
    # release where support is worth gating on.
    #
    # 0.0.48 fits the analysis window to each clip (`min(20, clip/3)`, floored at 3 s),
    # which is what makes short-clip offsets work: measured on 21 clips of the muvid#59
    # master in the 12-29 s band, 0.0.46 got 7 of 15 WRONG and left all of them unvoted,
    # while 0.0.48 got 21/21 right and voted on all of them.
    #
    # 0.0.49 GRADES that vote (thorwhalen/mixing#45): a window contributes 1.0 when its
    # own argmax reached the offset and at most 0.5 when the offset was merely on its
    # ballot, which is what makes `support` readable at a fitted window.
    #
    # 0.0.51 is the floor because it adds `ClipAlignment.margin` (thorwhalen/mixing#47) —
    # the same graded tally at the answer minus the tally at the best offset OUTSIDE the
    # tolerance. `support` says how much evidence reaches this offset; `margin` says
    # whether anything disputes it, which is the quantity muvid#59 was actually made of
    # (its near-tied peaks scored 0.993/0.989/0.987 and no fraction can see a runner-up).
    # It is required IN ADDITION to `edl.MIN_SUPPORT`, not instead of it. On 24 correct
    # alignments against six pure-NOISE clips `margin > 0` alone scored 24/24 and 0/6
    # where the support threshold scored 18/24, which argued for lowering the floor —
    # but that set contained no ALIASES, and on a repeating reference a bar-multiple
    # repeat can carry a positive margin (measured: an offset 7.97 s wrong at support
    # 0.487, margin +0.115). So the floor stays at 0.5 and margin is the second
    # condition. See `edl.MIN_SUPPORT` for the full table.
    "mixing>=0.0.51",
    "numpy",
    # 0.1.44 is where `graze.content_kind` exists alongside `graze.share_links`. muvid
    # needs both halves: normalise a pasted share link before fetching, then assert the
    # bytes are media rather than a sign-in page (muvid#23).
    "graze>=0.1.44",
    # The `looks` seam (muvid.footage.look): a compiled -vf fragment per cut, and the
    # in-shot punch-in of muvid#66. A CORE dependency rather than an extra because it
    # declares ZERO dependencies of its own and is stdlib-only, so it costs `import
    # muvid` nothing — the reason the other optional tiers exist does not apply. 0.0.11
    # is where `compile_motion` picks crop-vs-zoompan from what the path does and emits
    # `zoompan` with `d=1` + an explicit `fps`; below it a resizing window is either a
    # configure-time error or a silently retimed clip, which is the whole muvid#66 fix.
    "looks>=0.0.11",
]

[project.scripts]
muvid = "muvid.__main__:main"

[project.license]
text = "mit"

[project.urls]
Homepage = "https://github.com/thorwhalen/muvid"
Repository = "https://github.com/thorwhalen/muvid"
Documentation = "https://thorwhalen.github.io/muvid"

[project.optional-dependencies]
# The AI narrative pipeline (muvid.facade / muvid.renderers): image/video
# generation, lyric alignment, character/environment assets.
ai = [
    "falaw",
    # lacing>=0.0.28: the alignment .annot read sites pass SqliteStore(migrate=True),
    # which does not exist before 0.0.28 (verified against the published sdists, not
    # the changelog). lacing 0.0.31 is where the store schema goes v1->v2 and an
    # un-migrated open starts refusing; 0.0.28 is the floor that makes the remedy
    # available, which is the thing this package actually needs.
    "lacing>=0.0.28",
    "lookbook",
]
# The MCP tool surface (muvid.mcp) + the nw genre registration (muvid.genre) that
# lets a host connector serve the ffmpeg-only `music-visualizer` genre. `import muvid`
# never pulls these; only serving/aggregating does (thorwhalen/muvid#3). nw>=0.0.15 has
# the genre project-factory registry; py2mcp>=0.1.9 has the aggregation helpers.
mcp = [
    "fastmcp",
    "py2mcp>=0.1.9",
    # 0.0.34 is where `nw.delivery` exists — the Deliverable type + speakable
    # references that `muvid.downloads` returns. Below it, resolve() raises
    # ImportError at import time rather than serving a wrong shape, which is the
    # right failure: the previous arrangement had muvid returning its OWN
    # dataclass to a host typed `-> Path`, so every download 500'd while both
    # sides' tests stayed green (thorwhalen/reelee#296).
    "nw>=0.0.34",
]
# The footage SCORING layer's TORCH-FREE core tier (thorwhalen/muvid#13): quality gates +
# motion-to-beat + the Viterbi selector + editor score-tracks. This is what the prod
# connector installs. `mediapipe` provides face detection AND opencv-contrib-python (the cv2
# the CV kernels use — coexists with mixing's opencv-python; keep versions aligned).
# `mixing[beats]` adds librosa (ISC) for the master beat/onset grid. No torch → OOM-safe +
# commercial-clean. Heavy imports are lazy, so `import muvid` never pulls these.
scoring = [
    "mediapipe",
    "mixing[beats]>=0.0.30",
]
# Optional: enables the selector's `boundary_mode="beats+shots"` (PySceneDetect shot cuts as
# extra cut candidates). Absent → the mode degrades cleanly to beats-only.
scoring-shots = [
    "scenedetect",
]
# The lacing-native multichannel EDITOR bridge (muvid.footage.lacing_bridge,
# thorwhalen/muvid#31): exports a project's alignments/score-tracks/EDL as lacing standoff
# annotations for a multitrack editor (reelee-web#203), and reads a DECISION tier back into
# an EDL. Heavy import is lazy, so `import muvid`/`muvid.mcp` never pulls lacing.
editor = [
    "lacing",
]
# OPT-IN, OFF BY DEFAULT — the lip-sync tier (Demucs vocal separation + SyncNet LSE-C). NOT
# on the prod connector: the htdemucs weights are CC-BY-NC (research-only, not commercial-
# clean) and Demucs+SyncNet on CPU peak ~2-3 GB (OOM risk on the fragile box). Install only
# on a local/worker box you opt into, and point at licensed weights via MUVID_SYNCNET_*.
scoring-lipsync = [
    "demucs",
    "syncnet-python",
]
ui = [
    "fastapi",
    "uvicorn[standard]",
    "pydantic",
]
dev = [
    "falaw",
    "lacing>=0.0.28",  # see the `ai` extra
    "lookbook",
    "pytest>=7.0",
    "pytest-cov>=4.0",
    "ruff>=0.1.0",
]
docs = [
    "sphinx>=6.0",
    "sphinx-rtd-theme>=1.0",
]

[tool.ruff]
line-length = 88
target-version = "py310"
exclude = [
    "**/*.ipynb",
    ".git",
    ".venv",
    "build",
    "dist",
    "tests",
    "examples",
    "scrap",
]

[tool.ruff.lint]
select = [
    "D100",
]
ignore = [
    "D203",
    "E501",
    "B905",
]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.per-file-ignores]
"**/tests/*" = [
    "D",
]
"**/examples/*" = [
    "D",
]
"**/scrap/*" = [
    "D",
]

[tool.pytest.ini_options]
minversion = "6.0"
testpaths = [
    "tests",
]
doctest_optionflags = [
    "NORMALIZE_WHITESPACE",
    "ELLIPSIS",
]

# ffmpeg is a hard system requirement for muvid.visualize (and the pipeline's
# audio slicing). Declaring it here makes CI install it so the render tests run.
# Windows is intentionally omitted: the wads installer crashes emitting a "✓"
# on Windows' cp1252 console, and the ffmpeg-backed tests skip without it anyway.
[tool.wads.ops.ffmpeg]
description = "Multimedia framework for video/audio processing"
url = "https://ffmpeg.org/"
check.linux = "which ffmpeg"
check.macos = "which ffmpeg"
install.linux = ["sudo apt-get update", "sudo apt-get install -y ffmpeg"]
install.macos = "brew install ffmpeg"

[tool.wads.ci]
project_name = ""

# Install `ai` (narrative-pipeline tests need falaw/lacing/lookbook) + `mcp` (nw + fastmcp,
# without which tests/test_footage.py importorskips itself to 0% footage coverage — muvid#3,
# muvid#24 B5) + `ui` (fastapi/pydantic, without which tests/test_ui_app_post.py
# importorskips itself to 0% coverage — muvid#85) in CI. NOTE: .github/workflows/ci.yml
# hardcodes the same value in its two install-deps-uv steps; keep the three sites in
# agreement.
[tool.wads.ci.install]
extras = "ai,mcp,ui"

[tool.wads.ci.commands]
pre_test = []
test = []
post_test = []
lint = []
format = []

[tool.wads.ci.env]
required_envvars = []
test_envvars = []
extra_envvars = []

[tool.wads.ci.env.defaults]

[tool.wads.ci.quality.ruff]
enabled = true

[tool.wads.ci.quality.black]
enabled = false

[tool.wads.ci.quality.mypy]
enabled = false

[tool.wads.ci.testing]
python_versions = [
    "3.10",
    "3.12",
]
pytest_args = [
    "-v",
    "--tb=short",
]
coverage_enabled = true
coverage_threshold = 0
coverage_report_format = [
    "term",
    "xml",
]
exclude_paths = [
    "examples",
    "scrap",
]
test_on_windows = true

[tool.wads.ci.metrics]
enabled = true
config_path = ".github/umpyre-config.yml"
storage_branch = "code-metrics"
python_version = "3.10"
force_run = false

[tool.wads.ci.build]
sdist = true
wheel = true

[tool.wads.ci.publish]
enabled = true

[tool.wads.ci.docs]
enabled = true
builder = "epythet"
ignore_paths = [
    "tests/",
    "scrap/",
    "examples/",
]
