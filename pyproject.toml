[build-system]
requires = [
    "hatchling",
]
build-backend = "hatchling.build"

[project]
name = "muvid"
version = "0.0.27"
description = "Tools to make music videos"
readme = "README.md"
requires-python = ">=3.10"
keywords = []
authors = [
    { name = "Thor Whalen" },
]
# Core: the CLI (argh), the ffmpeg-based visualizer (mixing), and numpy for the
# beat-flash onset envelope (muvid.visualize.reactive). numpy arrives with
# `mixing` too, but muvid imports it directly so it is declared directly. The AI
# narrative pipeline's heavy dependencies are the optional `ai` extra, so
# `muvid.visualize` (and downstreams like `yb`) stay lightweight.
dependencies = [
    "argh",
    # 0.0.34 is where align_clips_to_reference scores on the onset envelope rather than
    # the raw waveform. Below it, every clip of a real multi-device shoot scores under
    # the confidence gate and the music-video path yields nothing (muvid#15).
    "mixing>=0.0.34",
    "numpy",
    # 0.1.44 is where `graze.content_kind` exists alongside `graze.share_links`. muvid
    # needs both halves: normalise a pasted share link before fetching, then assert the
    # bytes are media rather than a sign-in page (muvid#23).
    "graze>=0.1.44",
]

[project.scripts]
muvid = "muvid.__main__:main"

[project.license]
text = "mit"

[project.urls]
Homepage = "https://github.com/thorwhalen/muvid"
Repository = "https://github.com/thorwhalen/muvid"
Documentation = "https://thorwhalen.github.io/muvid"

[project.optional-dependencies]
# The AI narrative pipeline (muvid.facade / muvid.renderers): image/video
# generation, lyric alignment, character/environment assets.
ai = [
    "falaw",
    "lacing",
    "lookbook",
]
# The MCP tool surface (muvid.mcp) + the nw genre registration (muvid.genre) that
# lets a host connector serve the ffmpeg-only `music-visualizer` genre. `import muvid`
# never pulls these; only serving/aggregating does (thorwhalen/muvid#3). nw>=0.0.15 has
# the genre project-factory registry; py2mcp>=0.1.9 has the aggregation helpers.
mcp = [
    "fastmcp",
    "py2mcp>=0.1.9",
    "nw>=0.0.15",
]
# The footage SCORING layer's TORCH-FREE core tier (thorwhalen/muvid#13): quality gates +
# motion-to-beat + the Viterbi selector + editor score-tracks. This is what the prod
# connector installs. `mediapipe` provides face detection AND opencv-contrib-python (the cv2
# the CV kernels use — coexists with mixing's opencv-python; keep versions aligned).
# `mixing[beats]` adds librosa (ISC) for the master beat/onset grid. No torch → OOM-safe +
# commercial-clean. Heavy imports are lazy, so `import muvid` never pulls these.
scoring = [
    "mediapipe",
    "mixing[beats]>=0.0.30",
]
# Optional: enables the selector's `boundary_mode="beats+shots"` (PySceneDetect shot cuts as
# extra cut candidates). Absent → the mode degrades cleanly to beats-only.
scoring-shots = [
    "scenedetect",
]
# The lacing-native multichannel EDITOR bridge (muvid.footage.lacing_bridge,
# thorwhalen/muvid#31): exports a project's alignments/score-tracks/EDL as lacing standoff
# annotations for a multitrack editor (reelee-web#203), and reads a DECISION tier back into
# an EDL. Heavy import is lazy, so `import muvid`/`muvid.mcp` never pulls lacing.
editor = [
    "lacing",
]
# OPT-IN, OFF BY DEFAULT — the lip-sync tier (Demucs vocal separation + SyncNet LSE-C). NOT
# on the prod connector: the htdemucs weights are CC-BY-NC (research-only, not commercial-
# clean) and Demucs+SyncNet on CPU peak ~2-3 GB (OOM risk on the fragile box). Install only
# on a local/worker box you opt into, and point at licensed weights via MUVID_SYNCNET_*.
scoring-lipsync = [
    "demucs",
    "syncnet-python",
]
ui = [
    "fastapi",
    "uvicorn[standard]",
    "pydantic",
]
dev = [
    "falaw",
    "lacing",
    "lookbook",
    "pytest>=7.0",
    "pytest-cov>=4.0",
    "ruff>=0.1.0",
]
docs = [
    "sphinx>=6.0",
    "sphinx-rtd-theme>=1.0",
]

[tool.ruff]
line-length = 88
target-version = "py310"
exclude = [
    "**/*.ipynb",
    ".git",
    ".venv",
    "build",
    "dist",
    "tests",
    "examples",
    "scrap",
]

[tool.ruff.lint]
select = [
    "D100",
]
ignore = [
    "D203",
    "E501",
    "B905",
]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.per-file-ignores]
"**/tests/*" = [
    "D",
]
"**/examples/*" = [
    "D",
]
"**/scrap/*" = [
    "D",
]

[tool.pytest.ini_options]
minversion = "6.0"
testpaths = [
    "tests",
]
doctest_optionflags = [
    "NORMALIZE_WHITESPACE",
    "ELLIPSIS",
]

# ffmpeg is a hard system requirement for muvid.visualize (and the pipeline's
# audio slicing). Declaring it here makes CI install it so the render tests run.
# Windows is intentionally omitted: the wads installer crashes emitting a "✓"
# on Windows' cp1252 console, and the ffmpeg-backed tests skip without it anyway.
[tool.wads.ops.ffmpeg]
description = "Multimedia framework for video/audio processing"
url = "https://ffmpeg.org/"
check.linux = "which ffmpeg"
check.macos = "which ffmpeg"
install.linux = ["sudo apt-get update", "sudo apt-get install -y ffmpeg"]
install.macos = "brew install ffmpeg"

[tool.wads.ci]
project_name = ""

# Install `ai` (narrative-pipeline tests need falaw/lacing/lookbook) + `mcp` (nw + fastmcp,
# without which tests/test_footage.py importorskips itself to 0% footage coverage — muvid#3,
# muvid#24 B5) in CI. NOTE: .github/workflows/ci.yml hardcodes the same value in its two
# install-deps-uv steps; keep the three sites in agreement.
[tool.wads.ci.install]
extras = "ai,mcp"

[tool.wads.ci.commands]
pre_test = []
test = []
post_test = []
lint = []
format = []

[tool.wads.ci.env]
required_envvars = []
test_envvars = []
extra_envvars = []

[tool.wads.ci.env.defaults]

[tool.wads.ci.quality.ruff]
enabled = true

[tool.wads.ci.quality.black]
enabled = false

[tool.wads.ci.quality.mypy]
enabled = false

[tool.wads.ci.testing]
python_versions = [
    "3.10",
    "3.12",
]
pytest_args = [
    "-v",
    "--tb=short",
]
coverage_enabled = true
coverage_threshold = 0
coverage_report_format = [
    "term",
    "xml",
]
exclude_paths = [
    "examples",
    "scrap",
]
test_on_windows = true

[tool.wads.ci.metrics]
enabled = true
config_path = ".github/umpyre-config.yml"
storage_branch = "code-metrics"
python_version = "3.10"
force_run = false

[tool.wads.ci.build]
sdist = true
wheel = true

[tool.wads.ci.publish]
enabled = true

[tool.wads.ci.docs]
enabled = true
builder = "epythet"
ignore_paths = [
    "tests/",
    "scrap/",
    "examples/",
]
